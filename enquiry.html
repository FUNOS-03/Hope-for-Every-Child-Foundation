<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Involved | Hope for Every Child Foundation</title>

    <meta name="description"
        content="Get involved with Hope for Every Child Foundation by volunteering, supporting programmes or making an enquiry.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="programmes.html">Programmes</a>
        <a href="enquiry.html">Get Involved</a>
        <a href="contact.html">Contact</a>
    </nav>


    <!-- Main content -->
    <main>

        <!-- Introduction -->
        <section class="intro">

            <h1>Get Involved</h1>

            <p>
                There are many ways to support our work. Complete the form
                below to let us know how you would like to get involved.
            </p>

        </section>


        <!-- Enquiry form -->
        <section class="programmes">

            <h2>Send Us an Enquiry</h2>

            <form id="enquiryForm">

                <div>
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </div>


                <div>
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>


                <div>
                    <label for="interest">
                        How would you like to help?
                    </label>

                    <select
                        id="interest"
                        name="interest"
                        required
                    >

                        <option value="">Please select</option>

                        <option value="volunteer">
                            Volunteer
                        </option>

                        <option value="education">
                            Support Education
                        </option>

                        <option value="nutrition">
                            Support Nutrition
                        </option>

                        <option value="community">
                            Community Support
                        </option>

                    </select>
                </div>


                <div>
                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>


                <button
                    type="submit"
                    class="button"
                >
                    Submit Enquiry
                </button>

            </form>


            <p id="enquiryMessage"></p>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Hope for Every Child Foundation.
            All rights reserved.
        </p>

        <p>
            Website Project by Lufuno Tshivhase
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
